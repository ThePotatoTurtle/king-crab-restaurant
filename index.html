<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KING CRAB RESTAURANT SIMULATOR</title>
<meta name="description" content="Catch a crab. Truck it to Vancouver. Boil it. Retire.">
<style>
  html,body{margin:0;height:100%;background:#2b2118;overflow:hidden;
    font-family:"Comic Sans MS","Chalkboard SE","Comic Neue",cursive;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#fdf6e3;cursor:none;
    box-shadow:0 0 0 6px #20180f, 0 18px 50px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
/* ============================================================ ENGINE ==== */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=960,H=600,DPR=1;
var FONT='"Comic Sans MS","Chalkboard SE","Comic Neue",cursive';
var INK='#20180f';

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*DPR; cv.height=H*DPR;
  var s=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
window.addEventListener('resize',resize); resize();

/* ---- input ---- */
var M={x:W/2,y:H/2,down:false,press:false,rel:false};
function mpos(cx,cy){var r=cv.getBoundingClientRect();M.x=(cx-r.left)/r.width*W;M.y=(cy-r.top)/r.height*H;}
cv.addEventListener('mousemove',function(e){mpos(e.clientX,e.clientY);});
cv.addEventListener('mousedown',function(e){if(e.button!==0)return;mpos(e.clientX,e.clientY);M.down=true;M.press=true;audioInit();});
window.addEventListener('mouseup',function(e){if(e.button!==0)return;M.down=false;M.rel=true;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('touchstart',function(e){e.preventDefault();var t=e.changedTouches[0];mpos(t.clientX,t.clientY);M.down=true;M.press=true;audioInit();},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();var t=e.changedTouches[0];mpos(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();M.down=false;M.rel=true;},{passive:false});
window.addEventListener('keydown',function(e){ if(e.key==='m'||e.key==='M'){muted=!muted;} });

/* ---- audio ---- */
var AC=null,muted=false;
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d,type,v,slide){
  if(!AC||muted)return; d=d||0.1; v=v||0.06;
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
}
var nbuf=null;
function noise(d,v,lp){
  if(!AC||muted)return; d=d||0.2; v=v||0.1;
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var dd=nbuf.getChannelData(0);
    for(var i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;}
  var s=AC.createBufferSource(); s.buffer=nbuf; s.loop=true;
  var g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;
  f.type='lowpass'; f.frequency.value=lp||1200;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t+d);
}
function sfxGood(){tone(440,.08,'square',.07);setTimeout(function(){tone(660,.09,'square',.07);},70);setTimeout(function(){tone(880,.16,'square',.07);},150);}
function sfxBad(){tone(180,.28,'sawtooth',.07,-120);}
function sfxBonk(){noise(.14,.16,700);tone(90,.14,'square',.08,-40);}
function sfxSplash(){noise(.35,.1,2600);}
function sfxClick(){tone(760,.04,'square',.045);}

/* ---- wobble drawing ---- */
var WSEED=0,T=0,FRAME=0,WOB=1.5,WSC=1;
/* how often the wobble reseeds, in seconds. time-based so the boil looks the
   same at 60Hz and 120Hz. lower = jitterier. */
var WOBT=0,WOBRATE=0.2;
function nz(a){var n=Math.sin(a*127.1+WSEED*311.7)*43758.5453;return n-Math.floor(n)-0.5;}
function jx(x,y,i){return nz(x*0.31+y*0.17+i*3.77)*2*WOB*WSC;}
function jy(x,y,i){return nz(x*0.53+y*0.29+i*5.13+91.7)*2*WOB*WSC;}

function subdiv(pts,close,step){
  var out=[],n=pts.length,lim=close?n:n-1,i,j;
  for(i=0;i<lim;i++){
    var a=pts[i],b=pts[(i+1)%n];
    var d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    var k=Math.max(1,Math.round(d/step));
    for(j=0;j<k;j++){var t=j/k;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
  }
  if(!close)out.push(pts[n-1]);
  return out;
}
function trace(pts,close,step){
  var p=subdiv(pts,close,(step||26)*WSC);
  ctx.beginPath();
  for(var i=0;i<p.length;i++){
    var x=p[i][0]+jx(p[i][0],p[i][1],i),y=p[i][1]+jy(p[i][0],p[i][1],i);
    if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
  }
  if(close)ctx.closePath();
}
/* the fill is deliberately offset = kid colouring outside the lines */
function shape(pts,fill,lw,close,stroke,step){
  if(close===undefined)close=true;
  if(lw===undefined)lw=4;
  if(fill){
    /* offset the fill, but never by more than a fraction of the shape itself */
    var i,x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(i=0;i<pts.length;i++){x0=Math.min(x0,pts[i][0]);x1=Math.max(x1,pts[i][0]);
      y0=Math.min(y0,pts[i][1]);y1=Math.max(y1,pts[i][1]);}
    var cap=Math.min(4.6*WSC,Math.max(x1-x0,y1-y0)*0.11);
    var ox=nz(pts[0][0]*0.7+pts.length)*2*cap,oy=nz(pts[0][1]*0.9+13)*2*cap;
    ctx.save();ctx.translate(ox,oy);trace(pts,true,step);ctx.fillStyle=fill;ctx.fill();ctx.restore();
  }
  if(lw>0){trace(pts,close,step);ctx.strokeStyle=stroke||INK;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
}
function cpts(x,y,rx,ry,n,rot){
  ry=(ry===undefined||ry===null)?rx:ry; n=n||Math.max(11,Math.round(Math.max(rx,ry)*0.8));
  rot=rot||0; var a=[],co=Math.cos(rot),si=Math.sin(rot);
  for(var i=0;i<n;i++){var t=i/n*Math.PI*2,px=Math.cos(t)*rx,py=Math.sin(t)*ry;
    a.push([x+px*co-py*si,y+px*si+py*co]);}
  return a;
}
function circ(x,y,r,fill,lw){shape(cpts(x,y,r),fill,lw===undefined?4:lw);}
function ell(x,y,rx,ry,fill,lw,rot){shape(cpts(x,y,rx,ry,null,rot),fill,lw===undefined?4:lw);}
function rct(x,y,w,h,fill,lw){shape([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],fill,lw===undefined?4:lw);}
function ln(pts,col,lw){shape(pts,null,lw===undefined?4:lw,false,col||INK);}
function flat(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}

function txt(s,x,y,size,col,align,rot,outline){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.font='bold '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(outline){ctx.lineWidth=Math.max(3,size*0.24);ctx.strokeStyle=outline;ctx.lineJoin='round';ctx.strokeText(s,0,0);}
  ctx.fillStyle=col||INK;ctx.fillText(s,0,0);ctx.restore();
}
function tw(s,size){ctx.save();ctx.font='bold '+size+'px '+FONT;var w=ctx.measureText(s).width;ctx.restore();return w;}

function btn(x,y,w,h,label,size){
  size=size||26;
  var hov=M.x>x-w/2&&M.x<x+w/2&&M.y>y-h/2&&M.y<y+h/2;
  var p=hov?5:0;
  ctx.save();ctx.globalAlpha=.25;rct(x-w/2+5,y-h/2+7,w,h,INK,0);ctx.restore();
  rct(x-w/2-p,y-h/2-p,w+p*2,h+p*2,hov?'#ffd93d':'#fff6c9',5);
  txt(label,x,y+1,size);
  if(hov&&M.press){sfxClick();return true;}
  return false;
}

/* ---- particles / floating text ---- */
var parts=[],pops=[];
function part(x,y,vx,vy,col,r,life,grav,kind){
  parts.push({x:x,y:y,vx:vx,vy:vy,c:col,r:r,l:life,t:0,g:grav===undefined?600:grav,k:kind||'dot',rot:Math.random()*6.28,vr:(Math.random()-.5)*8});
}
function burst(x,y,n,col,spd,life){
  for(var i=0;i<n;i++){var a=Math.random()*6.283,s=spd*(0.4+Math.random());
    part(x,y,Math.cos(a)*s,Math.sin(a)*s-60,col,3+Math.random()*5,life||0.9,500);}
}
function pop(text,x,y,col,size){pops.push({s:text,x:x,y:y,t:0,c:col||'#e23b2e',z:size||26});}
function stepFX(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.t>p.l||p.y>H+90)parts.splice(i,1);}
  for(i=pops.length-1;i>=0;i--){var q=pops[i];q.t+=dt;q.y-=34*dt;if(q.t>1.7)pops.splice(i,1);}
}
function drawFX(){
  var i;
  for(i=0;i<parts.length;i++){var p=parts[i];
    ctx.save();ctx.globalAlpha=Math.max(0,1-p.t/p.l);
    if(p.k==='bill'){ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      rct(-p.r*1.7,-p.r,p.r*3.4,p.r*2,'#96d17a',3);txt('$',0,1,p.r*1.5,'#1c5b2a');}
    else if(p.k==='star'){ctx.translate(p.x,p.y);ctx.rotate(p.rot);txt('*',0,0,p.r*4,p.c);}
    else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
      ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.stroke();}
    ctx.restore();}
  for(i=0;i<pops.length;i++){var q=pops[i];
    ctx.save();ctx.globalAlpha=Math.max(0,1-Math.max(0,q.t-1)/0.7);
    txt(q.s,q.x,q.y,q.z,q.c,'center',nz(q.x)*0.12,'#fff');ctx.restore();}
}

/* ---- screen shake ---- */
var shake=0;
function kick(a){shake=Math.max(shake,a);}
/* ============================================================== ART ===== */

function crown(cx,cy,w){
  shape([[cx-w,cy],[cx-w,cy-w*0.85],[cx-w*0.45,cy-w*0.3],[cx,cy-w*1.15],
         [cx+w*0.45,cy-w*0.3],[cx+w,cy-w*0.85],[cx+w,cy]],'#ffd93d',4);
  circ(cx,cy-w*1.25,3.5,'#e23b2e',2.5);
}
function pincer(px,py,side,open,col,dark,ang){
  ctx.save();ctx.translate(px,py);ctx.scale(side,1);ctx.rotate(ang||0);
  shape([[-14,-15],[13,-18],[21,7],[-8,13]],col,4);              /* palm */
  ctx.save();ctx.rotate(-open*0.45);                              /* top finger */
  shape([[8,-15],[40,-17],[43,-5],[11,-1]],col,4);ctx.restore();
  ctx.save();ctx.rotate(open*0.32);                               /* bottom finger */
  shape([[10,-1],[39,4],[36,14],[8,11]],dark,4);ctx.restore();
  ctx.restore();
}
/* the star of the show. local space ~ 110x80 at scale 1 */
function drawCrab(x,y,s,o){
  o=o||{};
  var t=(o.t===undefined?T:o.t);
  var body=o.cooked?'#ff5a1f':'#a94430';
  var dark=o.cooked?'#d93d08':'#7d2c1e';
  var wig=(o.wig===undefined?1:o.wig);
  var i,side,_w=WSC; WSC=WSC/s;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); if(o.rot)ctx.rotate(o.rot);
  /* legs */
  var legA=[-0.10,0.16,0.42,0.68];
  for(side=-1;side<=1;side+=2){
    for(i=0;i<4;i++){
      var a=legA[i], ph=t*2.6+i*1.0+(side>0?0.7:0);
      var x0=side*30, y0=-10+i*7;
      var d1=a-0.95+Math.sin(ph)*0.14*wig;
      var x1=x0+side*Math.cos(d1)*36, y1=y0+Math.sin(d1)*36;
      var d2=a+0.55+Math.sin(ph+1)*0.18*wig;
      var x2=x1+side*Math.cos(d2)*32, y2=y1+Math.sin(d2)*32;
      var d3=a+1.2+Math.sin(ph+2)*0.1*wig;
      var x3=x2+side*Math.cos(d3)*22, y3=y2+Math.sin(d3)*22;
      ln([[x0,y0],[x1,y1],[x2,y2],[x3,y3]],dark,8);
      ln([[x0,y0],[x1,y1],[x2,y2]],body,3.2);
    }
  }
  /* claws */
  for(side=-1;side<=1;side+=2){
    var sw=Math.sin(t*1.7+(side>0?1.6:0))*(o.angry?10:5)*wig;
    var ax=side*24, ay=-8;
    var ex=ax+side*44, ey=ay-30+sw;
    ln([[ax,ay],[ax+side*30,ay-22+sw*0.5],[ex,ey]],dark,11);
    pincer(ex,ey,side,(Math.sin(t*2.2+side*1.7)*0.5+0.5)*(o.angry?1:0.6),body,dark,-0.55);
  }
  /* carapace */
  var bp=[];
  for(i=0;i<20;i++){var aa=i/20*6.283,r=(i%2?1.05:0.98);
    bp.push([Math.cos(aa)*50*r,Math.sin(aa)*29*r-4]);}
  shape(bp,body,5);
  ln([[-26,-13],[-9,-19],[9,-19],[26,-13]],dark,3);
  circ(-20,5,3,dark,0); circ(0,10,3,dark,0); circ(20,5,3,dark,0);
  /* eyes on stalks */
  var lx=0,ly=0;
  if(o.look){var dx=o.look[0]-x,dy=o.look[1]-y,m=Math.hypot(dx,dy)||1;lx=dx/m*3.2;ly=dy/m*3.2;}
  for(side=-1;side<=1;side+=2){
    var sx=side*15, sy=-26, tx2=sx+side*10, ty2=sy-20-Math.sin(t*2+side)*2;
    ln([[sx,sy],[tx2,ty2]],dark,5);
    circ(tx2,ty2,10,'#fffdf5',4);
    circ(tx2+lx,ty2+ly,4.4,INK,0);
  }
  /* mouth */
  if(o.angry) ln([[-9,14],[0,9],[9,14]],INK,3);
  else ln([[-9,10],[0,15],[9,10]],INK,3);
  if(o.crown!==false) crown(0,-40,12);
  ctx.restore(); WSC=_w;
  if(o.cooked&&o.steam){
    for(i=0;i<3;i++){
      var ph2=(T*0.9+i*0.33)%1;
      ctx.save();ctx.globalAlpha=(1-ph2)*0.75;
      circ(x+(i-1)*22*s+Math.sin(T*2+i)*8,y-55*s-ph2*70,9+ph2*12,'#fff',3);ctx.restore();
    }
  }
}

function drawBubbles(x,y,n,seed,spread,rise){
  for(var i=0;i<n;i++){
    var ph=(T*(rise||0.5)+i/n+seed*0.37)%1;
    ctx.save();ctx.globalAlpha=0.5+0.4*(1-ph);
    circ(x+Math.sin(T*1.7+i*2.1)*(spread||14),y-ph*(rise?90:70),3+(i%3)*2,'#dff3ff',2.2);
    ctx.restore();
  }
}
function drawBoat(x,y,t){
  ctx.save();ctx.translate(x,y+Math.sin(t*1.6)*4);ctx.rotate(Math.sin(t*1.2)*0.045);
  shape([[-78,-6],[78,-6],[58,30],[-58,30]],'#d94a3d',5);
  rct(-40,-46,52,40,'#fffdf5',5);
  rct(-30,-38,16,14,'#7fd4f0',3); rct(-8,-38,16,14,'#7fd4f0',3);
  ln([[26,-6],[26,-72]],INK,5);
  shape([[26,-72],[62,-58],[26,-46]],'#ffd93d',4);
  txt('S.S. PROFIT',6,14,13,'#fffdf5');
  ctx.restore();
}
function drawPotCage(x,y,full){
  ctx.save();ctx.translate(x,y);
  rct(-34,-26,68,52,'rgba(210,180,120,.45)',5);
  for(var i=-1;i<2;i++)ln([[i*22,-26],[i*22,26]],'#6b5a3e',3);
  for(var j=-1;j<2;j++)ln([[-34,j*18],[34,j*18]],'#6b5a3e',3);
  ln([[-24,-26],[0,-46],[24,-26]],INK,4);
  circ(0,-46,5,'#aaa',3);
  ctx.restore();
}
function drawTruck(x,y,t,o){
  o=o||{};
  ctx.save();ctx.translate(x,y);
  var wob=Math.sin(t*10)*1.0+(o.bump||0);
  ctx.translate(0,wob);
  /* tank trailer */
  rct(-150,-92,190,84,'#cfe9f5',5);
  rct(-142,-84,174,68,'#9fdcf2',0);
  txt('LIVE',-118,-64,15,'#1a4e63');
  txt('CRAB',-118,-46,15,'#1a4e63');
  if(o.crab) drawCrab(-40+Math.sin(t*3)*10,-52+Math.sin(t*4.4)*6,0.42,{t:t,crown:true,wig:1.4});
  drawBubbles(-70,-24,5,2,12,1);
  /* cab */
  shape([[44,-92],[112,-92],[128,-48],[128,-8],[44,-8]],'#e23b2e',5);
  shape([[58,-84],[104,-84],[114,-52],[58,-52]],'#bfe9ff',4);
  rct(-152,-12,282,14,'#4a3a28',4);
  /* wheels */
  var wr=t*9;
  var wheels=[-124,-62,92];
  for(var i=0;i<wheels.length;i++){
    ctx.save();ctx.translate(wheels[i],14);ctx.rotate(wr);
    circ(0,0,24,'#333',5); circ(0,0,9,'#bbb',4);
    ln([[-16,0],[16,0]],'#bbb',3); ln([[0,-16],[0,16]],'#bbb',3);
    ctx.restore();
  }
  ctx.restore();
}
function drawPerson(x,y,s,o){
  o=o||{};
  var t=(o.t===undefined?T:o.t),_w=WSC;WSC=WSC/s;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  var bob=Math.sin(t*(o.walk?6:1.6))*(o.walk?3:1.5);
  ctx.translate(0,bob);
  /* legs */
  var sw=o.walk?Math.sin(t*6)*14:0;
  ln([[0,0],[-9+sw,34]],INK,6); ln([[0,0],[9-sw,34]],INK,6);
  /* body */
  shape([[-20,-52],[20,-52],[16,2],[-16,2]],o.shirt||'#4f86c6',5);
  /* arms */
  var aw=o.wave?Math.sin(t*4)*22:0;
  ln([[-18,-44],[-34,-16+aw]],INK,6);
  ln([[18,-44],[34+(o.point?10:0),(o.point?-40:-16)-aw]],INK,6);
  /* head */
  circ(0,-72,20,o.skin||'#f2c79a',5);
  circ(-7,-76,3,INK,0); circ(7,-76,3,INK,0);
  if(o.happy)ln([[-9,-66],[0,-59],[9,-66]],INK,3); else ln([[-8,-63],[8,-63]],INK,3);
  if(o.hat==='chef'){
    shape([[-20,-88],[20,-88],[20,-96],[-20,-96]],'#fffdf5',4);
    circ(-13,-108,13,'#fffdf5',4);circ(0,-114,15,'#fffdf5',4);circ(13,-108,13,'#fffdf5',4);
  } else if(o.hat==='hair'){
    shape([[-21,-80],[-14,-96],[0,-90],[14,-96],[21,-80]],o.hair||'#5a3a22',4);
  } else if(o.hat==='top'){
    rct(-15,-118,30,28,'#20180f',4); rct(-24,-92,48,7,'#20180f',4);
  }
  ctx.restore(); WSC=_w;
}
function bubble(x,y,w,h,text,size,tail){
  rct(x-w/2,y-h/2,w,h,'#fffdf5',5);
  if(tail!==0)shape([[x-14,y+h/2-2],[x+2,y+h/2-2],[x-6+(tail||0),y+h/2+22]],'#fffdf5',5);
  var lines=String(text).split('|');
  for(var i=0;i<lines.length;i++)
    txt(lines[i],x,y-(lines.length-1)*(size*0.65)+i*size*1.3,size||18);
}
function drawGlassTank(x,y,w,h,lvl){
  rct(x,y+h*(1-lvl),w,h*lvl,'#7fd4f0',0);
  ctx.save();ctx.globalAlpha=.55;
  for(var i=0;i<4;i++)ln([[x+10+i*(w/4),y+h*(1-lvl)+8],[x+24+i*(w/4),y+h-8]],'#fff',5);
  ctx.restore();
  rct(x,y,w,h,null,6);
  ln([[x,y+h*(1-lvl)],[x+w,y+h*(1-lvl)]],'#2e8fb0',4);
}
function drawMountains(off,col,base,amp,seed){

      ['1 (ONE) KING CRAB, WHOLESALE','$23'],
      ['"MARKET PRICE"','x 2,043'],

      ['CANDLELIGHT FEE','+ $600'],
      ['FRESHNESS '+Math.round(G.freshness)+'%','x '+freshMult.toFixed(2)],
      ['DONENESS: '+(G.done||'PERFECT'),'x '+dm.toFixed(2)]

    var shown=Math.min(3,G.penalties.length),rolled=0;
    for(i=0;i<shown;i++)PD.lines.push([G.penalties[i].s,'- $'+G.penalties[i].v]);
    for(i=shown;i<G.penalties.length;i++)rolled+=G.penalties[i].v;
    if(rolled>0)PD.lines.push([(G.penalties.length-shown)+' MORE INCIDENTS','- '+money(rolled)]);
    G.career+=PD.net;G.runs++;

        localStorage.setItem('kcrs_runs',String(G.runs));}catch(e){}
    tone(523,.1,'square',.07);
    setTimeout(function(){tone(659,.1,'square',.07);},110);

    setTimeout(function(){tone(1046,.4,'square',.08);},330);
  },
  update:function(dt){
    var target=PD.net*Math.min(1,Math.max(0,(st-0.5)/2.2));
    if(target>PD.shown){
      PD.shown=target;PD.tick+=dt;
      if(PD.tick>0.05){PD.tick=0;tone(600+Math.random()*900,.03,'square',.03);}
    }
    PD.rain+=dt;
    if(PD.rain>0.045&&st<9){
      PD.rain=0;
      part(Math.random()*W,-40,(Math.random()-.5)*60,60+Math.random()*120,'#96d17a',
        9+Math.random()*6,3.4,60,'bill');
    }
    if(st>0.5&&Math.random()<dt*7)
      part(W/2+(Math.random()-.5)*500,200+Math.random()*200,(Math.random()-.5)*160,-140,'#ffd93d',4,1.1,260,'star');
  },
  draw:function(){
    flat(0,0,W,H,'#1f6b3a');
    /* rotating gold rays */
    ctx.save();ctx.translate(W/2,250);
    for(var i=0;i<16;i++){
      ctx.save();ctx.rotate(T*0.35+i*0.3927);
      ctx.fillStyle=i%2?'#2c8a4c':'#277b44';
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1200,-90);ctx.lineTo(1200,90);ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    if(st<0.35){ctx.fillStyle='rgba(255,255,255,'+(1-st/0.35)+')';ctx.fillRect(0,0,W,H);}
    var sc=1+Math.sin(Math.min(st,1)*Math.PI)*0.12;
    ctx.save();ctx.translate(W/2,96);ctx.scale(sc,sc);ctx.rotate(Math.sin(T*2.4)*0.02);
    txt('KA-CHING',0,0,60,'#ffd93d','center',0,INK);
    ctx.restore();
    txt(money(PD.shown),W/2,178,78,'#fffdf5','center',Math.sin(T*2.4)*0.012,INK);
    txt('PROFIT, THIS EVENING',W/2,228,20,'#c9f0d4');
    drawPerson(108,H-30,1.2,{hat:'chef',shirt:'#fffdf5',wave:true,happy:true});
    drawCrab(W-104,H-104+Math.sin(T*2)*6,0.6,{crown:true,cooked:true,wig:0.6,t:T});
    txt('RIP '+G.crabName,W-104,H-44,14,'#c9f0d4');
    /* receipt */
    if(st>2.5){
      ctx.save();ctx.globalAlpha=Math.min(1,(st-2.5)/0.6);
      var rw=500,rx=W/2-rw/2,ry=252,rh=40+PD.lines.length*21;
      rct(rx,ry,rw,rh,'#fffdf5',5);
      txt('ITEMISED',W/2,ry+18,17,'#8a7a5a');
      for(var j=0;j<PD.lines.length;j++){
        var ly=ry+38+j*21;
        txt(PD.lines[j][0],rx+16,ly,14,INK,'left');
        txt(PD.lines[j][1],rx+rw-16,ly,14,PD.lines[j][1].charAt(0)==='-'?'#e23b2e':'#2e7d4f','right');
      }
      ctx.restore();
    }
    if(st>4.0){
      ctx.save();ctx.globalAlpha=Math.min(1,(st-4.0)/0.5);
      if(btn(W/2,542,320,54,'CATCH ANOTHER ONE',25)){resetRun();go('ocean');}
      ctx.restore();
      txt('career: '+money(G.career)+'  /  '+G.runs+' crab'+(G.runs>1?'s':''),W/2,586,15,'#c9f0d4');
    }
  }
};

/* =========================================================== LOOP ======= */
var last=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  T+=dt;FRAME++;st+=dt;
  WOBT+=dt; if(WOBT>=WOBRATE){WOBT-=WOBRATE;WSEED=(WSEED+1)%101;}
  if(trans===1){wipe+=dt*3.6;if(wipe>=1){wipe=1;setScene(pend);trans=2;}}
  else if(trans===2){wipe-=dt*3.6;if(wipe<=0){wipe=0;trans=0;}}
  else scenes[scene].update(dt);
  stepFX(dt);
  if(shake>0)shake=Math.max(0,shake-dt*70);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  scenes[scene].draw();
  drawFX();
  ctx.restore();
  drawWipe();
  if(muted)txt('MUTED',W-56,H-24,14,'#8a7a5a');
  cursorClaw();
  M.press=false;M.rel=false;
  requestAnimationFrame(frame);
}
resetRun();
setScene('title');
requestAnimationFrame(frame);

</script>
</body>
